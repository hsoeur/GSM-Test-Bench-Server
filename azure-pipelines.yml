trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: Release
  dotnetSdkVersion: 9.x
  agentPoolName: Default
  agentName: VM-DEVOPS
  projectPath: Api.TestGsm/Api.TestGsm.csproj
  solutionPath: Api.TestGsm.sln
  artifactName: api-test-gsm
  packageName: api-test-gsm.tar.gz
  remoteTempPath: /tmp/api-test-gsm
  remoteAppPath: /opt/ApiTestGsm/publish
  systemdServiceName: api-testgsm.service
  serviceUser: admin_romu
  sshServiceConnection: prod-linux-api-test-gsm

stages:
  - stage: Build
    displayName: Build and package
    jobs:
      - job: Build
        displayName: Build API
        pool:
          name: $(agentPoolName)
          demands:
            - agent.name -equals $(agentName)
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetSdkVersion)

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: $(solutionPath)

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: $(solutionPath)
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Publish
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(projectPath)
              arguments: --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-restore /p:UseAppHost=false
              zipAfterPublish: false
              modifyOutputPath: false

          - task: ArchiveFiles@2
            displayName: Create deployment package
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/publish
              includeRootFolder: false
              archiveType: tar
              tarCompression: gz
              archiveFile: $(Build.ArtifactStagingDirectory)/$(packageName)
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/$(packageName)
            displayName: Publish artifact
            artifact: $(artifactName)

  - stage: Deploy
    displayName: Deploy to Linux
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployProduction
        displayName: Deploy API
        environment: production
        pool:
          name: $(agentPoolName)
          demands:
            - agent.name -equals $(agentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(artifactName)

                - task: SSH@0
                  displayName: Prepare remote directory
                  inputs:
                    sshEndpoint: $(sshServiceConnection)
                    runOptions: inline
                    inline: |
                      set -euo pipefail
                      mkdir -p "$(remoteTempPath)"
                      rm -f "$(remoteTempPath)/$(packageName)"

                - task: CopyFilesOverSSH@0
                  displayName: Copy package to target
                  inputs:
                    sshEndpoint: $(sshServiceConnection)
                    sourceFolder: $(Pipeline.Workspace)/$(artifactName)
                    contents: $(packageName)
                    targetFolder: $(remoteTempPath)
                    cleanTargetFolder: false
                    overwrite: true

                - task: SSH@0
                  displayName: Install and restart service
                  inputs:
                    sshEndpoint: $(sshServiceConnection)
                    runOptions: inline
                    inline: |
                      set -euo pipefail

                      sudo mkdir -p "$(remoteAppPath)"
                      sudo systemctl stop "$(systemdServiceName)" || true
                      sudo tar -xzf "$(remoteTempPath)/$(packageName)" -C "$(remoteAppPath)"

                      if id -u "$(serviceUser)" >/dev/null 2>&1; then
                        sudo chown -R "$(serviceUser):$(serviceUser)" "$(remoteAppPath)"
                      fi

                      sudo systemctl daemon-reload
                      sudo systemctl restart "$(systemdServiceName)"
                      sudo systemctl status "$(systemdServiceName)" --no-pager --full
